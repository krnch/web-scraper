[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-web-scraper"
version = "0.1.0"
description = "Bounded offline listing parsing and normalization"
requires-python = ">=3.10"

[project.scripts]
web-scraper = "web_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["web_scraper*"]
